# One command to serve this static site in isolation:
#
#   docker compose up
#
# Then open http://localhost:8080
#
# There's only one service because this project has no backend or database
# to bring up alongside it — it's a static HTML/CSS/JS site.

services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./assets:/usr/share/nginx/html/assets:ro
